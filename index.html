<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>实验室组会记录</title>
  <link rel="stylesheet" href="main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- ===== Navigation Bar ===== -->
<nav class="navbar">
  <a class="navbar-brand" href="#meeting-list">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    <span>实验室组会记录</span>
  </a>
  <div class="navbar-actions">
    <button class="btn btn-ghost btn-sm" id="btn-export" title="导出数据">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      导出
    </button>
    <button class="btn btn-ghost btn-sm" id="btn-import" title="导入数据">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      导入
    </button>
    <button class="btn btn-ghost btn-sm" id="btn-github-settings" title="GitHub 仓库设置">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
      GitHub
    </button>
    <input type="file" id="import-file" accept=".json" style="display:none">
    <button class="btn btn-primary" id="btn-new-meeting">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      新建组会
    </button>
  </div>
</nav>

<!-- ===== Main Container ===== -->
<div class="main-container" id="app-root">
  <!-- Content rendered by JS -->
</div>

<!-- ===== Confirm Modal Template ===== -->
<div class="modal-overlay" id="confirm-modal">
  <div class="modal" style="max-width:400px">
    <div class="modal-body">
      <div class="confirm-dialog">
        <svg class="confirm-dialog-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <h3 id="confirm-title">确认删除</h3>
        <p id="confirm-message">此操作无法撤销，是否继续？</p>
        <div class="confirm-dialog-actions">
          <button class="btn btn-secondary" id="confirm-cancel">取消</button>
          <button class="btn btn-danger" id="confirm-ok">确认删除</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ===== GitHub Settings Modal ===== -->
<div class="modal-overlay" id="github-settings-modal">
  <div class="modal" style="max-width:480px">
    <div class="modal-header">
      <h2>GitHub 仓库设置</h2>
      <button class="btn btn-ghost btn-sm" id="github-settings-close">×</button>
    </div>
    <div class="modal-body">
      <div class="alert alert-info">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        <span>配置 GitHub Personal Access Token，将 PPT/PDF 文件存储到 <strong>HongjiaL/LabRecord</strong> 仓库的 <code>uploads/</code> 目录，突破 localStorage 容量限制。</span>
      </div>
      <div class="form-group">
        <label class="form-label">GitHub Fine-grained PAT</label>
        <input type="password" class="form-input" id="github-token-input" placeholder="github_pat_xxxxxxxxxxxx" autocomplete="off">
        <div class="form-hint">
          <a href="https://github.com/settings/tokens/new" target="_blank" rel="noopener">
            点击此处生成 Token（Permissions 需勾选 Contents: Read and write）
          </a>
        </div>
      </div>
      <div id="github-status" class="alert" style="display:none"></div>
      <div style="display:flex; gap:8px; margin-top:16px; flex-wrap:wrap">
        <button class="btn btn-primary" id="github-save-btn">保存 Token</button>
        <button class="btn btn-secondary" id="github-test-btn">测试连接</button>
        <button class="btn btn-danger" id="github-remove-btn" style="display:none">移除 Token</button>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
